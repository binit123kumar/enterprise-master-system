name: EnterpriseOS CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  DOTNET_VERSION: "8.0"
  PYTHON_VERSION: "3.11"

jobs:

  # ════════════════════════════════════════════════
  # JOB 1: Frontend Build + Test
  # ════════════════════════════════════════════════
  frontend:
    name: 🔵 Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint || true

      - name: Build React app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  # ════════════════════════════════════════════════
  # JOB 2: Backend Build + Test
  # ════════════════════════════════════════════════
  backend:
    name: 🟢 Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore packages
        run: dotnet restore ./backend/EnterpriseOS.API/EnterpriseOS.API.csproj

      - name: Build
        run: dotnet build ./backend/EnterpriseOS.API/EnterpriseOS.API.csproj --no-restore -c Release

      - name: Security scan (no secrets exposed)
        run: |
          if grep -r "password\|secret\|apikey" ./backend --include="*.cs" -i | grep -v "//"; then
            echo "⚠️ Possible secret exposure detected"
          else
            echo "✅ No secrets exposed in code"
          fi

  # ════════════════════════════════════════════════
  # JOB 3: Python Agent Test
  # ════════════════════════════════════════════════
  python-agent:
    name: 🟡 Python Agent Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r ./python-agent/requirements.txt

      - name: Syntax check
        run: python -m py_compile ./python-agent/main.py && echo "✅ Syntax OK"

  # ════════════════════════════════════════════════
  # JOB 4: Deploy to Render (only on main push)
  # ════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Render.com
    runs-on: ubuntu-latest
    needs: [frontend, backend, python-agent]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy Frontend to Render
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_FRONTEND_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'
          echo "✅ Frontend deploy triggered"

      - name: Deploy Backend to Render
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'
          echo "✅ Backend deploy triggered"

      - name: Notify success
        run: echo "🎉 EnterpriseOS v3.0.0 deployed successfully by Binit!"
