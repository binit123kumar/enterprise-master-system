version: "3.9"

# ════════════════════════════════════════════════════
# EnterpriseOS — Full Stack Docker Compose
# Owner: Binit
# Run: docker-compose up -d
# ════════════════════════════════════════════════════

services:

  # ── React Frontend ────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
      - VITE_AI_AGENT_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:5000/hubs/logs
    depends_on:
      - backend
    networks:
      - enterprise-net
    restart: unless-stopped

  # ── ASP.NET Core Backend ──────────────────────────
  backend:
    build:
      context: ./backend/EnterpriseOS.API
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EnterpriseOS;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=true
      - AppSettings__JwtSecret=${JWT_SECRET}
      - AppSettings__AIAgentUrl=http://python-agent:8000
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - enterprise-net
    restart: unless-stopped

  # ── Python AI Agent ───────────────────────────────
  python-agent:
    build:
      context: ./python-agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BACKEND_URL=http://backend:5000
    networks:
      - enterprise-net
    restart: unless-stopped

  # ── SQL Server ────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD}
      - MSSQL_PID=Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./backend/EnterpriseOS.API/Migrations:/migrations
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${SQL_PASSWORD}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - enterprise-net
    restart: unless-stopped

  # ── Redis Cache ───────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - enterprise-net
    restart: unless-stopped
    command: redis-server --appendonly yes

networks:
  enterprise-net:
    driver: bridge

volumes:
  sqlserver-data:
  redis-data:
